version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: workout-log-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: workout_log_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
